<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"
     aria-label="No photo available — contributions welcome">
  <defs>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#0a0a0a"/>
      <rect width="3" height="1" fill="#101010"/>
    </pattern>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#scan)"/>
  <rect width="1200" height="800" fill="url(#vignette)"/>

  <!-- Corner brackets in phosphor green -->
  <g fill="none" stroke="#1aff66" stroke-width="3">
    <path d="M 30 30 L 30 90 M 30 30 L 90 30"/>
    <path d="M 1170 30 L 1170 90 M 1170 30 L 1110 30"/>
    <path d="M 30 770 L 30 710 M 30 770 L 90 770"/>
    <path d="M 1170 770 L 1170 710 M 1170 770 L 1110 770"/>
  </g>

  <!-- Schematic plant glyph -->
  <g transform="translate(600 360)" fill="none" stroke="#0fcc4d" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 120 L 0 -40"/>
    <path d="M 0 30 C -50 0 -90 -10 -120 -50"/>
    <path d="M 0 0 C 50 -30 90 -40 120 -80"/>
    <path d="M 0 -20 C -40 -60 -50 -90 -40 -130"/>
    <path d="M 0 -40 C 40 -70 50 -100 40 -140"/>
    <ellipse cx="-120" cy="-50" rx="22" ry="10" transform="rotate(-30 -120 -50)"/>
    <ellipse cx="120" cy="-80" rx="22" ry="10" transform="rotate(30 120 -80)"/>
    <ellipse cx="-40" cy="-130" rx="20" ry="9" transform="rotate(-70 -40 -130)"/>
    <ellipse cx="40" cy="-140" rx="20" ry="9" transform="rotate(70 40 -140)"/>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" fill="#1aff66"
     text-anchor="middle">
    <text x="600" y="560" font-size="36" letter-spacing="6">NO PHOTO YET</text>
    <text x="600" y="600" font-size="18" fill="#0fcc4d" letter-spacing="3">
      &gt; contributions welcome
    </text>
    <text x="600" y="720" font-size="14" fill="#066b27" letter-spacing="2">
      plant-families-explorer · img/families/_placeholder.svg
    </text>
  </g>
</svg>
